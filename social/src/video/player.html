<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style id="fonts"></style>
<style>
  :root {
    --bg: #f5f2eb;
    --ink: #17160f;
    --ink-2: #6b665b;
    --gold: #a8740c;
    --gold-bright: #dba433;
    --chrome: #ebe8e1;
  }
  html, body { margin: 0; background: var(--bg); }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
    font-family: -apple-system, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; color: var(--ink);
  }
  #light {
    position: absolute; inset: 0;
    background:
      radial-gradient(1200px 900px at 18% 8%, rgba(255, 255, 255, 0.9), transparent 60%),
      radial-gradient(900px 700px at 90% 100%, rgba(219, 164, 51, 0.10), transparent 70%);
  }
  #grain {
    position: absolute; inset: 0; opacity: 0.5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0.09 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }
  .type {
    position: absolute; left: 92px; right: 92px;
    font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.015em; line-height: 1.02;
  }
  .type .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.02em 0.14em; margin: -0.04em 0 -0.14em; }
  .type .i { display: inline-block; will-change: transform; }
  .type .em { font-style: italic; color: var(--gold); }
  #fade {
    position: absolute; left: 0; right: 0; top: 0; height: 700px; pointer-events: none;
    background: linear-gradient(var(--bg) 0%, var(--bg) 62%, rgba(245, 242, 235, 0) 100%);
  }
  .win {
    position: absolute; left: 0; top: 0; width: 1240px; transform-origin: 0 0;
    border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 2px 6px rgba(23, 22, 15, 0.08), 0 30px 80px -10px rgba(23, 22, 15, 0.28);
    outline: 1px solid rgba(23, 22, 15, 0.08);
  }
  .bar { height: 40px; background: var(--chrome); display: flex; align-items: center; gap: 8px; padding: 0 16px; position: relative; border-bottom: 1px solid rgba(23, 22, 15, 0.08); }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .bar span { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; color: #7c776c; font-weight: 500; }
  .shot { position: relative; width: 1240px; height: 800px; }
  .shot img { position: absolute; inset: 0; width: 1240px; height: 800px; }
  #cursor { position: absolute; left: 0; top: 0; width: 46px; height: 46px; transform-origin: 6px 4px; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.25)); }
  #ring { position: absolute; border-radius: 50%; border: 5px solid var(--gold-bright); }
  .tag {
    position: absolute; left: 50%; top: 1640px; transform: translateX(-50%); white-space: nowrap;
    font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2);
    background: rgba(245, 242, 235, 0.92); border: 1px solid rgba(23, 22, 15, 0.1); border-radius: 999px; padding: 10px 22px;
  }
  .mark { position: absolute; left: 92px; top: 150px; display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; color: var(--ink-2); }
  .mark img { width: 44px; height: 44px; border-radius: 10px; }
  .end { position: absolute; inset: 0; }
  .end img { position: absolute; left: 430px; top: 500px; width: 220px; height: 220px; border-radius: 48px; box-shadow: 0 24px 60px -18px rgba(23, 22, 15, 0.45); }
  .end .url { position: absolute; left: 0; right: 0; top: 1186px; text-align: center; font-size: 46px; font-weight: 600; letter-spacing: 0.01em; }
  .end .url b { position: absolute; left: 50%; top: 66px; height: 5px; background: var(--gold-bright); border-radius: 3px; }
  .end .small { position: absolute; left: 0; right: 0; top: 1290px; text-align: center; font-size: 30px; color: var(--ink-2); }
</style>
</head>
<body>
<div id="stage">
  <div id="light"></div>
  <div id="scene"></div>
  <div id="grain"></div>
</div>
<script>
const DATA = /*__DATA__*/null;
const A = DATA.assets;
const D = DATA.timeline.demo;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const expo = (k) => { k = clamp(k); return k === 1 ? 1 : 1 - Math.pow(2, -10 * k); };
const inOut = (k) => { k = clamp(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const inCubic = (k) => { k = clamp(k); return k * k * k; };
const back = (k) => { k = clamp(k); const c = 1.4; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (id) => document.getElementById(id);

document.getElementById('fonts').textContent =
  `@font-face { font-family: 'Instrument Serif'; src: url(${A.serif}) format('woff2'); font-style: normal; }` +
  `@font-face { font-family: 'Instrument Serif'; src: url(${A.serifItalic}) format('woff2'); font-style: italic; }`;

function typeSize(words, big) {
  const chars = words.map((w) => w.w).join(' ').length;
  if (big) return chars <= 14 ? 168 : chars <= 26 ? 142 : chars <= 40 ? 122 : 104;
  return chars <= 22 ? 104 : chars <= 36 ? 92 : 80;
}

// Words rise out of a mask on the way in and leave upward on the way out.
function typeHTML(words, lt, dur, size, top, align = 'left') {
  const html = words.map((x, i) => {
    const kin = expo((lt - 0.08 - i * 0.065) / 0.7);
    const kout = inCubic((lt - (dur - 0.32) - i * 0.025) / 0.3);
    const y = (1 - kin) * 108 - kout * 108;
    return `<span class="w"><span class="i${x.em ? ' em' : ''}" style="transform:translateY(${y}%)">${esc(x.w)}</span></span>`;
  }).join(' ');
  const drift = lerp(1, 1.03, clamp(lt / Math.max(dur, 1)));
  const place = top === 'middle' ? `top:50%;transform:translateY(-58%) scale(${drift});transform-origin:0 50%` : `top:${top}px`;
  return `<div class="type" style="${place};font-size:${size}px;text-align:${align}">${html}</div>`;
}

// ---- the app window and its camera ---------------------------------------------
const CH = 40;
const CENTER = [540, 1110];
function cam(rect) {
  const [x, y, w, h] = rect;
  const p = Math.min(980 / w, 760 / (h + (y === 0 ? CH : 0)), 2.4);
  return { p, cx: x + w / 2, cy: y + h / 2 + CH };
}
const FULL = cam([0, -CH, 1240, 800 + CH]);
function mix(a, b, k) {
  return { p: Math.exp(lerp(Math.log(a.p), Math.log(b.p), k)), cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k) };
}
function cameraAt(demo, lt) {
  const focus = cam(demo.focus);
  const after = cam(demo.after);
  let c = mix(FULL, focus, inOut((lt - 0.3) / (D.focus - 0.3)));
  const moveFrom = demo.click ? D.click + 0.18 : D.swap + 0.1;
  c = mix(c, after, inOut((lt - moveFrom) / (D.after - moveFrom)));
  return c;
}
function toScreen(c, x, y) {
  return [CENTER[0] + c.p * (x - c.cx), CENTER[1] + c.p * (y + CH - c.cy)];
}

const CURSOR = `<svg viewBox="0 0 28 28" width="46" height="46"><path d="M6 3 L6 22 L10.6 17.6 L13.6 24.4 L16.6 23.1 L13.7 16.5 L20 16.5 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

function demoHTML(beat, lt, dur) {
  const demo = A.demos[beat.demo];
  const c = cameraAt(demo, lt);
  const enter = expo(lt / D.enter);
  const exit = inCubic((lt - (dur - 0.3)) / 0.3);
  const tx = CENTER[0] - c.p * c.cx;
  const ty = CENTER[1] - c.p * c.cy + (1 - enter) * 90 + exit * 70;
  const swapAt = demo.click ? D.click + 0.04 : D.swap;
  const swapLen = beat.demo === 'dark' ? 0.45 : 0.14;
  const k = demo.from === demo.to ? 0 : clamp((lt - swapAt) / swapLen);
  let html = `<div class="win" style="transform:translate(${tx}px,${ty}px) scale(${c.p});opacity:${clamp(enter * 1.4) * (1 - exit)}">` +
    `<div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>Goldfelty</span></div>` +
    `<div class="shot"><img src="${A.screens[demo.from]}" style="opacity:${1 - k}"><img src="${A.screens[demo.to]}" style="opacity:${k}"></div></div>`;
  html += `<div id="fade"></div>`;
  html += typeHTML(beat.words, lt, dur, typeSize(beat.words, false), 250);
  if (demo.click) {
    const target = toScreen(cameraAt(demo, D.click), demo.click[0], demo.click[1]);
    const start = [940, 1820];
    const km = inOut((lt - 0.6) / (D.click - 0.08 - 0.6));
    const arc = Math.sin(km * Math.PI) * 70;
    let x = lerp(start[0], target[0], km) - arc;
    let y = lerp(start[1], target[1], km);
    // After the click the camera moves; the cursor rides along, then fades.
    if (lt > D.click) {
      const now = toScreen(c, demo.click[0], demo.click[1]);
      x = now[0]; y = now[1];
    }
    const press = lt > D.click - 0.04 && lt < D.click + 0.16 ? 0.84 : 1;
    const op = clamp((lt - 0.55) / 0.2) * (1 - clamp((lt - (D.after - 0.2)) / 0.4)) * (1 - exit);
    html += `<div id="cursor" style="transform:translate(${x - 6}px,${y - 4}px) scale(${press});opacity:${op}">${CURSOR}</div>`;
    const kr = clamp((lt - D.click) / 0.5);
    if (kr > 0 && kr < 1) {
      const r = lerp(14, 90, expo(kr));
      html += `<div id="ring" style="left:${target[0] - r}px;top:${target[1] - r}px;width:${2 * r}px;height:${2 * r}px;opacity:${0.75 * (1 - kr)}"></div>`;
    }
  }
  html += `<div class="tag" style="opacity:${0.9 * clamp(enter) * (1 - exit)}">The real app · demo wallets</div>`;
  return html;
}

function endHTML(beat, lt) {
  const k = back((lt - 0.05) / 0.55);
  const name = [{ w: 'Goldfelty', em: false }];
  const under = expo((lt - 0.75) / 0.6);
  return `<div class="end">` +
    `<img src="${A.logo}" style="transform:scale(${lerp(0.4, 1, k)});opacity:${clamp(lt / 0.25)}">` +
    typeHTML(name, lt - 0.15, 99, 176, 770, 'center') +
    typeHTML(beat.words, lt - 0.35, 99, 84, 982, 'center') +
    `<div class="url" style="opacity:${clamp((lt - 0.6) / 0.3)}">goldfelty.com<b style="width:${360 * under}px;margin-left:${-180}px"></b></div>` +
    `<div class="small" style="opacity:${clamp((lt - 0.9) / 0.3)}">Free for macOS, Windows and Linux</div>` +
    `</div>`;
}

const images = [];
window.ready = async () => {
  const srcs = [...Object.values(A.screens), A.logo];
  for (const src of srcs) { const img = new Image(); img.src = src; await img.decode(); images.push(img); }
  await document.fonts.load("100px 'Instrument Serif'");
  await document.fonts.load("italic 100px 'Instrument Serif'");
  await document.fonts.ready;
  return DATA.timeline.duration;
};

window.renderAt = (t) => {
  const tl = DATA.timeline;
  const beat = tl.beats.find((b) => t >= b.start && t < b.end) || tl.beats[tl.beats.length - 1];
  const lt = t - beat.start;
  const dur = beat.end - beat.start;
  const root = $('scene');
  if (beat.kind === 'type') {
    root.innerHTML = `<div class="mark" style="opacity:${0.85 * clamp(t / 0.4)}"><img src="${A.logo}">Goldfelty</div>` +
      typeHTML(beat.words, lt, dur, typeSize(beat.words, true), 'middle');
  }
  else if (beat.kind === 'demo') root.innerHTML = demoHTML(beat, lt, dur);
  else root.innerHTML = endHTML(beat, lt);
};
</script>
</body>
</html>
