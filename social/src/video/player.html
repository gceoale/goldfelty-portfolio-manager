<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  * { box-sizing: border-box; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: "Inter", "SF Pro Display", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
    color: #fff;
  }
  #bg, #scene, #subs, #flash, #mark { position: absolute; inset: 0; }
  #flash { background: #fff; opacity: 0; pointer-events: none; }
  .abs { position: absolute; }
  .center { left: 50%; transform: translateX(-50%); }
  .caption {
    position: absolute; left: 60px; right: 60px; text-align: center; font-weight: 900;
    line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance;
  }
  .caption span { display: inline-block; margin: 0 0.12em; }
  .gold { color: #F5C04A; }
  .stroke { paint-order: stroke fill; -webkit-text-stroke: 12px #000; }
  #subs .chunk {
    position: absolute; left: 50px; right: 50px; top: 1310px; text-align: center;
    font-size: 78px; font-weight: 900; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance;
  }
  #subs .chunk span { display: inline-block; margin: 0 0.14em; paint-order: stroke fill; -webkit-text-stroke: 14px #000; }
  .bubble {
    position: absolute; background: #fff; color: #141414; border-radius: 44px; padding: 30px 40px;
    font-size: 56px; font-weight: 800; line-height: 1.15; max-width: 860px; text-align: left;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  .bubble:after {
    content: ""; position: absolute; bottom: -34px; left: var(--tail, 50%); margin-left: -22px;
    border-width: 36px 22px 0 22px; border-style: solid; border-color: #fff transparent transparent transparent;
  }
  .bubble .future { opacity: 0.0; }
  .bubble .now { color: #C8891B; }
  .name { position: absolute; font-size: 40px; font-weight: 800; text-align: center; width: 400px; margin-left: -200px; opacity: .9; }
  .phone {
    position: absolute; left: 110px; top: 250px; width: 860px; height: 1380px; border-radius: 80px;
    background: #fff; border: 16px solid #0b0b0b; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.5);
  }
  .phone .head {
    position: absolute; left: 0; right: 0; top: 0; height: 190px; background: #f4f4f6; border-bottom: 2px solid #e2e2e6;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 18px; color: #111;
  }
  .phone .head .dot { width: 86px; height: 86px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 40px; color: #fff; }
  .phone .head .who { font-size: 32px; font-weight: 700; margin-top: 8px; }
  .phone .msgs { position: absolute; left: 0; right: 0; top: 190px; bottom: 0; overflow: hidden; }
  .phone .col { position: absolute; left: 0; right: 0; top: 0; padding: 30px 34px; display: flex; flex-direction: column; gap: 18px; }
  .msg { max-width: 600px; padding: 22px 30px; border-radius: 40px; font-size: 46px; font-weight: 600; line-height: 1.2; transform-origin: bottom; }
  .msg.me { align-self: flex-end; background: #2F7CF6; color: #fff; border-bottom-right-radius: 12px; }
  .msg.them { align-self: flex-start; background: #E9E9EB; color: #111; border-bottom-left-radius: 12px; }
  .win {
    position: absolute; width: 540px; height: 350px; border-radius: 22px; background: #fbfbfb; color: #222; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.45); border: 2px solid rgba(0,0,0,.15);
  }
  .win .bar { height: 64px; display: flex; align-items: center; padding: 0 22px; gap: 10px; font-size: 30px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; }
  .win .bar i { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.7); display: inline-block; flex: none; }
  .win .rows { padding: 22px; display: grid; gap: 16px; }
  .win .row { height: 26px; border-radius: 8px; background: #e6e6e6; }
  .win .num { font-size: 54px; font-weight: 900; color: #999; }
  .badge { position: absolute; padding: 16px 30px; border-radius: 999px; background: #F5C04A; color: #1a1408; font-weight: 900; font-size: 44px; }
  .device { position: absolute; left: 40px; width: 1000px; border-radius: 36px; background: #0b0b0b; padding: 18px; box-shadow: 0 40px 90px rgba(0,0,0,.55); }
  .viewport { position: relative; width: 964px; overflow: hidden; border-radius: 20px; background: #fff; }
  .viewport img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .tag { position: absolute; right: 30px; bottom: -70px; font-size: 32px; font-weight: 700; color: rgba(255,255,255,.75); }
  .pill { display: inline-block; padding: 22px 54px; border-radius: 999px; background: #F5C04A; color: #1a1408; font-weight: 900; font-size: 70px; }
  #mark { pointer-events: none; }
  #mark .m { position: absolute; left: 56px; top: 120px; display: flex; align-items: center; gap: 16px; font-size: 36px; font-weight: 800; opacity: .78; }
  #mark img { width: 60px; height: 60px; border-radius: 14px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="scene"></div>
  <div id="subs"></div>
  <div id="mark"></div>
  <div id="flash"></div>
</div>
<script>
const DATA = /*__DATA__*/null;
const W = 1080, H = 1920;
const COLORS = { gold: '#E0A93B', blue: '#4C7DFF', orange: '#FF8A3D', purple: '#9B6BFF', green: '#3CC47C', red: '#FF5A5F', pink: '#FF6FB5', gray: '#8E949B' };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (k) => 1 - Math.pow(1 - clamp(k), 3);
const easeInOut = (k) => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeBack = (k) => { k = clamp(k); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cast = Object.fromEntries(DATA.cast.map((c, i) => [c.id, { ...c, phase: i * 1.7 }]));
const $ = (id) => document.getElementById(id);

// Seeded random, so every render of a frame is identical.
function rand(seed) { let x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

function lineAt(scene, t) { return scene.lines.find((l) => t >= l.start && t < l.end + 0.12) || null; }
function speakingAt(t, id, scene) {
  const l = scene.lines.find((l) => l.speaker === id && t >= l.start && t < l.end);
  if (!l) return 0;
  const w = l.words.find((w) => t >= w.start && t < w.end);
  const inWord = w ? clamp((t - w.start) / Math.max(.05, w.end - w.start)) : 0;
  return w ? (0.35 + 0.65 * Math.abs(Math.sin(inWord * Math.PI * 1.6 + cast[id].phase))) : 0.15;
}

function avatar(id, t, open, size) {
  const c = cast[id] || { look: 'person', color: 'gold', phase: 0 };
  const col = COLORS[c.color] || COLORS.gold;
  const blink = ((t + c.phase) % 3.3) < 0.11;
  const eyeRy = blink ? 1.2 : 8;
  const mouth = (cx, cy) => `<ellipse cx="${cx}" cy="${cy}" rx="${11 + open * 5}" ry="${2.5 + open * 13}" fill="#4a1414"/>`;
  const eyes = (x1, x2, y) => `<ellipse cx="${x1}" cy="${y}" rx="7" ry="${eyeRy}" fill="#151515"/><ellipse cx="${x2}" cy="${y}" rx="7" ry="${eyeRy}" fill="#151515"/>`;
  let body = '';
  if (c.look === 'person' || c.look === 'friend') {
    const skin = c.look === 'person' ? '#F2C7A1' : '#C58C62';
    const hair = c.look === 'person'
      ? `<path d="M46 86 Q46 26 100 26 Q156 26 154 86 Q142 54 100 56 Q62 56 46 86Z" fill="#2a2018"/>`
      : `<circle cx="100" cy="24" r="22" fill="#1d1612"/><path d="M48 84 Q50 34 100 34 Q150 34 152 84 Q140 60 100 60 Q60 60 48 84Z" fill="#1d1612"/>`;
    body = `<path d="M24 200 Q26 142 100 142 Q174 142 176 200Z" fill="${col}"/><circle cx="100" cy="88" r="54" fill="${skin}"/>${hair}${eyes(80, 120, 90)}${mouth(100, 116)}`;
  } else if (c.look === 'wallet') {
    body = `<rect x="22" y="48" width="156" height="118" rx="26" fill="${col}"/><rect x="22" y="48" width="156" height="30" rx="14" fill="rgba(0,0,0,.18)"/>` +
      `<rect x="118" y="88" width="64" height="44" rx="14" fill="rgba(0,0,0,.22)"/><circle cx="150" cy="110" r="8" fill="#fff"/>` +
      `<circle cx="62" cy="104" r="14" fill="#fff"/><circle cx="98" cy="104" r="14" fill="#fff"/>${eyes(64, 100, 106)}${mouth(81, 140)}`;
  } else if (c.look === 'coin') {
    body = `<circle cx="100" cy="104" r="78" fill="#E0A93B" stroke="#B07D1A" stroke-width="10"/><circle cx="100" cy="104" r="58" fill="none" stroke="#F7D57E" stroke-width="5"/>${eyes(80, 120, 96)}${mouth(100, 128)}`;
  } else if (c.look === 'goldfelty') {
    body = `<image href="${DATA.assets.logo}" x="18" y="18" width="164" height="164"/>` +
      `<circle cx="72" cy="26" r="22" fill="#fff" stroke="#0c0c0c" stroke-width="4"/><circle cx="128" cy="26" r="22" fill="#fff" stroke="#0c0c0c" stroke-width="4"/>` +
      `<circle cx="${72 + Math.sin(t * 7 + 1) * 7}" cy="${30 + Math.cos(t * 5) * 5}" r="${blink ? 2 : 9}" fill="#0c0c0c"/><circle cx="${128 + Math.sin(t * 6) * 7}" cy="${30 + Math.cos(t * 7 + 2) * 5}" r="${blink ? 2 : 9}" fill="#0c0c0c"/>` +
      `<ellipse cx="100" cy="150" rx="${10 + open * 5}" ry="${2 + open * 10}" fill="#F5C04A"/>`;
  } else return '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 200 200">${body}</svg>`;
}

function captionHTML(text, t, start, size) {
  const words = text.split(/\s+/).filter(Boolean);
  return words.map((w, i) => {
    const k = easeBack((t - start - i * 0.07) / 0.28);
    const o = clamp((t - start - i * 0.07) / 0.12);
    const goldWord = i === words.length - 1 ? ' gold' : '';
    return `<span class="stroke${goldWord}" style="opacity:${o};transform:scale(${lerp(1.7, 1, k)})">${esc(w)}</span>`;
  }).join(' ');
}
function capSize(text, big) {
  const n = text.length;
  if (big) return n <= 14 ? 132 : n <= 24 ? 112 : n <= 40 ? 94 : 80;
  return n <= 20 ? 92 : n <= 36 ? 80 : 68;
}

// Subtitles: three or four words at a time, the current word gold.
function chunksOf(words) {
  const out = []; let cur = [];
  words.forEach((w, i) => {
    cur.push(i);
    if (cur.length >= 4 || /[.,!?;:]$/.test(w.w) && cur.length >= 2) { out.push(cur); cur = []; }
  });
  if (cur.length) out.push(cur);
  return out;
}
function renderSubs(scene, t) {
  const el = $('subs');
  if (!['hook', 'chaos', 'app', 'punchline', 'outro'].includes(scene.kind)) { el.innerHTML = ''; return; }
  const line = lineAt(scene, t);
  if (!line) { el.innerHTML = ''; return; }
  let cur = line.words.findIndex((w) => t >= w.start && t < w.end);
  if (cur === -1) cur = t >= line.end ? line.words.length - 1 : 0;
  const chunk = chunksOf(line.words).find((c) => c.includes(cur)) || [];
  el.innerHTML = `<div class="chunk" style="top:${scene.kind === 'outro' ? 1400 : 1310}px">${chunk.map((i) => {
    const w = line.words[i];
    const pop = i === cur ? lerp(1.18, 1.06, easeOut((t - w.start) / 0.12)) : 1;
    return `<span class="${i === cur ? 'gold' : ''}" style="transform:scale(${pop})">${esc(w.w)}</span>`;
  }).join(' ')}</div>`;
}

// ---- scenes ----
const scenes = {
  hook(s, t, root) {
    const lt = t - s.start;
    const speaker = (lineAt(s, t) || s.lines[0])?.speaker;
    const size = capSize(s.caption, true);
    root.innerHTML = `<div class="caption" style="top:330px;font-size:${size}px">${captionHTML(s.caption, t, s.start, size)}</div>` +
      (speaker && cast[speaker]?.look !== 'none'
        ? `<div class="abs" style="left:${540 - 230}px;top:${760 + Math.sin(lt * 5) * 10}px;transform:scale(${lerp(.6, 1, easeBack(lt / .4))})">${avatar(speaker, t, speakingAt(t, speaker, s), 460)}</div>` : '');
  },
  punchline(s, t, root) {
    const lt = t - s.start;
    const shake = Math.sin(lt * 60) * 18 * Math.exp(-lt * 5);
    const size = capSize(s.caption, true) + 10;
    const speaker = (lineAt(s, t) || s.lines.filter((l) => t >= l.start).at(-1) || s.lines[0])?.speaker;
    root.innerHTML = `<div class="caption gold" style="top:520px;font-size:${size}px;transform:translateX(${shake}px) rotate(${shake * .1}deg)">${captionHTML(s.caption, t, s.start, size)}</div>` +
      (speaker && cast[speaker]?.look !== 'none'
        ? `<div class="abs" style="left:${540 - 170}px;top:${900 + Math.abs(Math.sin(lt * 7)) * -16}px">${avatar(speaker, t, speakingAt(t, speaker, s), 340)}</div>` : '');
  },
  dialogue(s, t, root) {
    const lt = t - s.start;
    const ids = [...new Set(s.lines.map((l) => l.speaker))].filter((id) => cast[id] && cast[id].look !== 'none').slice(0, 3);
    const xs = ids.length === 1 ? [540] : ids.length === 2 ? [290, 790] : [200, 540, 880];
    const size = ids.length === 3 ? 300 : 380;
    const line = lineAt(s, t);
    let html = s.caption ? `<div class="caption" style="top:230px;font-size:${capSize(s.caption)}px">${captionHTML(s.caption, t, s.start, 80)}</div>` : '';
    ids.forEach((id, i) => {
      const talking = line && line.speaker === id;
      const k = talking ? 1.08 : 0.92;
      const bob = talking ? Math.sin(t * 9) * 10 : Math.sin(t * 2 + i) * 4;
      const enter = easeBack((lt - i * 0.08) / 0.35);
      html += `<div class="abs" style="left:${xs[i] - size / 2}px;top:${1010 + bob}px;opacity:${talking || !line ? 1 : .55};transform:scale(${k * enter})">${avatar(id, t, speakingAt(t, id, s), size)}</div>`;
      html += `<div class="name" style="left:${xs[i]}px;top:${1010 + size + 10}px">${esc(cast[id].name)}</div>`;
    });
    if (line && cast[line.speaker]) {
      const i = Math.max(0, ids.indexOf(line.speaker));
      const x = xs[i] ?? 540;
      const cur = line.words.findIndex((w) => t >= w.start && t < w.end);
      const shown = line.words.map((w, wi) => `<span class="${t < w.start ? 'future' : wi === cur ? 'now' : ''}">${esc(w.w)}</span>`).join(' ');
      const pop = easeBack((t - line.start) / 0.22);
      const left = clamp(x - 430, 60, W - 60 - 860);
      const tail = clamp(x - left, 80, 780);
      html += `<div class="bubble" style="left:${left}px;bottom:${1920 - 950}px;width:860px;--tail:${tail}px;transform:scale(${lerp(.7, 1, pop)});transform-origin:${tail}px 100%">${shown}</div>`;
    }
    root.innerHTML = html;
  },
  chat(s, t, root) {
    const speakers = [...new Set(s.lines.map((l) => l.speaker))];
    const me = speakers[0];
    const them = speakers.find((id) => id !== me) || me;
    const others = speakers.filter((id) => id !== me);
    const group = others.length > 1;
    const other = group
      ? { name: others.map((id) => cast[id]?.name || id).join(', '), color: 'gray', initial: String(others.length + 1) }
      : cast[them] || { name: '?', color: 'gray' };
    const msgs = s.lines.filter((l) => t >= l.start).map((l) => {
      const k = easeBack((t - l.start) / 0.22);
      const mine = l.speaker === me;
      const who = group && !mine ? `<div style="font-size:30px;font-weight:800;color:${COLORS[cast[l.speaker]?.color] || '#666'};margin:0 0 6px 8px">${esc(cast[l.speaker]?.name || '')}</div>` : '';
      return `<div style="align-self:${mine ? 'flex-end' : 'flex-start'};transform:scale(${lerp(.5, 1, k)});transform-origin:${mine ? 'right' : 'left'} bottom;opacity:${clamp((t - l.start) / .08)}">${who}<div class="msg ${mine ? 'me' : 'them'}">${esc(l.text)}</div></div>`;
    }).join('');
    const enter = easeOut((t - s.start) / 0.35);
    root.innerHTML = (s.caption ? `<div class="caption" style="top:120px;font-size:64px">${captionHTML(s.caption, t, s.start, 64)}</div>` : '') +
      `<div class="phone" style="transform:translateY(${lerp(300, 0, enter)}px);opacity:${enter}">` +
      `<div class="head"><div class="dot" style="background:${COLORS[other.color] || '#888'}">${esc(other.initial || (other.name || '?').slice(0, 1).toUpperCase())}</div><div class="who">${esc(group ? `${others.length + 1} people` : other.name)}</div></div>` +
      `<div class="msgs"><div class="col" id="col">${msgs}</div></div></div>`;
    const col = document.getElementById('col');
    const view = 1380 - 190 - 32;
    const over = col.scrollHeight - view;
    if (over > 0) col.style.transform = `translateY(${-over}px)`;
  },
  chaos(s, t, root) {
    const lt = t - s.start;
    const dur = s.end - s.start;
    const items = s.chaos_items.length ? s.chaos_items : ['Wallet 1', 'Wallet 2', 'Block explorer', 'portfolio_FINAL_v7.xlsx', 'Price site', 'Wallet 3'];
    const n = Math.min(18, Math.max(9, items.length * 2));
    const palette = ['#F6851B', '#AB9FF2', '#0052FF', '#3CC47C', '#FF5A5F', '#111', '#E0A93B', '#2F7CF6'];
    let html = '';
    let visible = 0;
    for (let i = 0; i < n; i++) {
      const at = (i / n) * dur * 0.7;
      if (lt < at) continue;
      visible++;
      const k = easeBack((lt - at) / 0.25);
      const jitter = clamp((lt - dur * 0.45) / (dur * 0.5)) * 14;
      const x = 20 + rand(i * 3 + 1) * 520 + Math.sin(t * 40 + i) * jitter;
      const y = 300 + rand(i * 7 + 2) * 900 + Math.cos(t * 37 + i) * jitter;
      const r = (rand(i * 11 + 3) - .5) * 18;
      const title = items[i % items.length];
      html += `<div class="win" style="left:${x}px;top:${y}px;transform:rotate(${r}deg) scale(${lerp(.3, 1, k)});z-index:${i}">` +
        `<div class="bar" style="background:${palette[i % palette.length]}"><i></i><i></i><i></i>&nbsp;${esc(title)}</div>` +
        `<div class="rows"><div class="num">$${['???', '?,???', '??.??', '????'][i % 4]}</div><div class="row" style="width:${60 + rand(i) * 35}%"></div><div class="row" style="width:${40 + rand(i + 9) * 50}%"></div></div></div>`;
    }
    html += `<div class="badge" style="left:50%;top:1220px;transform:translateX(-50%) scale(${1 + Math.sin(t * 12) * .03});z-index:50">Tabs open: ${visible * 3}</div>`;
    if (s.caption) html += `<div class="caption" style="top:190px;font-size:${capSize(s.caption)}px;z-index:60">${captionHTML(s.caption, t, s.start, 80)}</div>`;
    root.innerHTML = html;
  },
  app(s, t, root) {
    const lt = t - s.start;
    const dur = s.end - s.start;
    const scr = DATA.assets.screens[s.screen] || DATA.assets.screens.overview;
    const img = images[s.screen] || images.overview;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const VW = 964, VH = Math.round(964 * ih / iw);
    const base = VW / iw;
    const hs = scr.hotspots[s.hotspot];
    let scale = base, ox = 0, oy = 0;
    if (hs) {
      const z = easeInOut((lt - 0.5) / Math.max(0.6, dur - 1.1));
      const [hx, hy, hw, hh] = hs;
      const target = Math.min(3.2, Math.min(iw / hw, ih / hh) * 0.92);
      scale = base * lerp(1, target, z);
      const cx = lerp(iw / 2, hx + hw / 2, z), cy = lerp(ih / 2, hy + hh / 2, z);
      ox = clamp(VW / 2 - cx * scale, VW - iw * scale, 0);
      oy = clamp(VH / 2 - cy * scale, VH - ih * scale, 0);
    }
    const enter = easeBack(lt / 0.4);
    const top = 560;
    root.innerHTML = (s.caption ? `<div class="caption" style="top:250px;font-size:${capSize(s.caption)}px">${captionHTML(s.caption, t, s.start, 80)}</div>` : '') +
      `<div class="device" style="top:${top}px;transform:scale(${lerp(.7, 1, enter)}) rotate(${lerp(-4, 0, enter)}deg)">` +
      `<div class="viewport" style="height:${VH}px"><img src="${scr.src}" style="width:${iw}px;height:${ih}px;transform:translate(${ox}px,${oy}px) scale(${scale})"></div>` +
      `<div class="tag">The real app · demo wallets</div></div>`;
  },
  outro(s, t, root) {
    const lt = t - s.start;
    const k = easeBack(lt / 0.45);
    const k2 = easeOut((lt - 0.3) / 0.4);
    root.innerHTML = `<div class="abs" style="left:390px;top:430px;transform:scale(${lerp(.3, 1, k)}) rotate(${lerp(-20, 0, k)}deg)"><img src="${DATA.assets.logo}" style="width:300px;height:300px;border-radius:64px;box-shadow:0 30px 80px rgba(224,169,59,.35)"></div>` +
      `<div class="caption" style="top:790px;font-size:120px;opacity:${k2}">Goldfelty</div>` +
      `<div class="caption" style="top:950px;font-size:62px;font-weight:800;opacity:${k2}">${esc(s.caption || 'Every wallet. One app.')}</div>` +
      `<div class="abs" style="left:0;right:0;top:1080px;text-align:center;opacity:${k2};transform:scale(${1 + Math.sin(t * 6) * .02})"><span class="pill">goldfelty.com</span></div>` +
      `<div class="caption" style="top:1250px;font-size:40px;font-weight:700;opacity:${k2 * .8}">Free · macOS · Windows · Linux</div>`;
  },
};

const images = {};
let mounted = -1;

window.ready = async () => {
  for (const [name, s] of Object.entries(DATA.assets.screens)) {
    const img = new Image(); img.src = s.src; await img.decode(); images[name] = img;
  }
  const logo = new Image(); logo.src = DATA.assets.logo; await logo.decode();
  await document.fonts.ready;
  $('mark').innerHTML = `<div class="m"><img src="${DATA.assets.logo}">goldfelty.com</div>`;
  return DATA.timeline.duration;
};

window.renderAt = (t) => {
  const tl = DATA.timeline;
  const scene = tl.scenes.find((s) => t >= s.start && t < s.end) || tl.scenes[tl.scenes.length - 1];
  const gx = 50 + Math.sin(t * .35) * 22, gy = 30 + Math.cos(t * .27) * 12;
  $('bg').style.background = `radial-gradient(circle at ${gx}% ${gy}%, rgba(224,169,59,.28), transparent 55%), radial-gradient(circle at ${100 - gx}% ${100 - gy}%, rgba(76,125,255,.14), transparent 50%), linear-gradient(180deg, #17140f, #0b0a08)`;
  const root = $('scene');
  if (mounted !== scene.index) { root.innerHTML = ''; mounted = scene.index; }
  const lt = t - scene.start;
  root.style.transform = `scale(${lerp(1.06, 1, easeOut(lt / 0.2))})`;
  $('flash').style.opacity = scene.index === 0 ? 0 : clamp(0.22 - lt * 1.4, 0, 0.22);
  (scenes[scene.kind] || scenes.hook)(scene, t, root);
  renderSubs(scene, t);
  $('mark').style.opacity = scene.kind === 'outro' ? 0 : 1;
};
</script>
</body>
</html>
