appId: com.goldfelty.portfolio
productName: Goldfelty Portfolio Manager
copyright: Copyright © 2026 Goldfelty

directories:
  buildResources: resources
  output: release/${version}

files:
  - out/**/*
  - package.json
  - '!**/{.eslintrc,.editorconfig,.prettierrc,tsconfig*.json}'
  - '!**/*.map'

asar: true
electronDownload:
  cache: .cache/electron

# ---------------------------------------------------------------------------
# macOS — Apple silicon (arm64) and Intel (x64), plus a universal binary.
# ---------------------------------------------------------------------------
mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # electron-builder derives .icns from this 1024px source.
  icon: resources/icon.png
  # Without this the default-arch (x64) zip is named "-mac.zip" with no arch,
  # while the arm64 one is "-arm64-mac.zip". Name both the same way.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Goldfelty does not use the camera.
    LSApplicationCategoryType: public.app-category.finance
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    # The app entry carries no `type`: electron-builder fills in the built
    # .app itself. Saying `type: file` without a `path` makes it resolve the
    # path to the project directory and fail with "not a file".
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications

# ---------------------------------------------------------------------------
# Windows — x64 and ARM64 (Snapdragon / Windows on ARM).
# ---------------------------------------------------------------------------
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
  # electron-builder derives .ico from this 1024px source.
  icon: resources/icon.png
nsis:
  # nsis and portable are both served by NsisTarget, so a shared
  # win.artifactName made them write to the same paths and silently clobber
  # each other. Each target names its own output.
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

# ---------------------------------------------------------------------------
# Linux — x64 and ARM64.
# ---------------------------------------------------------------------------
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
  icon: resources/icons
  category: Office;Finance
  maintainer: Goldfelty <support@goldfelty.com>
  synopsis: Multi-wallet smart-account portfolio manager
  # Covers tar.gz, whose x64 build was otherwise named with no arch at all.
  # deb and rpm restate their own defaults below so they keep the naming
  # their ecosystems expect (amd64/arm64, x86_64/aarch64).
  artifactName: ${name}-${version}-${arch}.${ext}
  desktop:
    entry:
      Name: Goldfelty Portfolio Manager
      StartupWMClass: goldfelty-portfolio-manager
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
rpm:
  artifactName: ${name}-${version}.${arch}.${ext}

publish:
  provider: github
  owner: gceoalexyt-ops
  repo: goldfelty-portfolio-manager
