<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Opening Goldfelty…</title>
<style>
  :root { --brass:#9d7422; --bg:#f7f4ed; --ink:#1b1813; --ink2:#5b5346; --rule:#e1d9c9; }
  @media (prefers-color-scheme: dark) { :root { --brass:#c0912f; --bg:#100f0d; --ink:#f2ece1; --ink2:#a89f91; --rule:#2a251e; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; padding:24px; }
  .card { max-width:420px; text-align:center; }
  h1 { font-family:'Iowan Old Style',Palatino,Georgia,serif; font-weight:400; font-size:26px; margin:0 0 10px; }
  p { color:var(--ink2); margin:0 0 20px; }
  a.btn { display:inline-block; padding:11px 20px; border-radius:3px; background:var(--brass); color:var(--bg);
    text-decoration:none; font-weight:500; font-size:14.5px; }
  .muted { font-size:13px; color:var(--ink2); margin-top:18px; }
  .muted a { color:var(--brass); }
</style>
</head>
<body>
<div class="card">
  <h1>Opening Goldfelty…</h1>
  <p id="msg">Handing this connection to the desktop app.</p>
  <a class="btn" id="open" href="#">Open Goldfelty</a>
  <p class="muted">Nothing happening? <a href="https://github.com/gceoalexyt-ops/goldfelty-portfolio-manager/releases/latest">Install the app</a>, then open this link again.</p>
</div>
<script>
(function () {
  var uri = new URLSearchParams(location.search).get('uri');
  var msg = document.getElementById('msg');
  var open = document.getElementById('open');

  // Only a WalletConnect pairing URI is ever forwarded. The desktop app checks
  // this too, but there is no reason to hand it anything else from here.
  if (!uri || uri.indexOf('wc:') !== 0) {
    msg.textContent = 'This link is missing a valid WalletConnect URI.';
    open.style.display = 'none';
    return;
  }

  var target = 'goldfelty://wc?uri=' + encodeURIComponent(uri);
  open.href = target;
  location.href = target;

  setTimeout(function () {
    msg.textContent = 'If the app did not open, use the button below.';
  }, 1600);
})();
</script>
</body>
</html>
