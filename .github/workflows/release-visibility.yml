name: Hide or show a release

# Run by hand to take a release down without deleting it (it goes back to
# a draft, so only maintainers can see it) or to put it back up.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.2.0'
        required: true
        type: string
      action:
        description: 'hide = back to draft, show = publish as latest, show-older = publish but keep the current latest'
        required: true
        type: choice
        options: [hide, show, show-older]

permissions:
  contents: write

jobs:
  visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          ACTION: ${{ inputs.action }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.0"; exit 1
          fi
          case "$ACTION" in
            hide) gh release edit "$TAG" --draft=true ;;
            show) gh release edit "$TAG" --draft=false --latest ;;
            show-older) gh release edit "$TAG" --draft=false --latest=false ;;
            *) echo "::error::Unknown action $ACTION"; exit 1 ;;
          esac
          gh release list --limit 5
