name: Build desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.0.0). Leave blank to build the installers without cutting a release.'
        required: false
        type: string
      draft:
        description: 'Create the release as a draft instead of publishing it'
        required: false
        default: false
        type: boolean

# Read-only by default. Only the publish job, which creates the release,
# gets write access.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: Apple silicon and Intel. macos-14 runners are arm64, so the
          # x64 slice is cross-compiled from the same host.
          - os: macos-14
            label: macOS (arm64 + x64)
            command: npm run dist:mac
          # Windows: x64 and ARM64 (Windows on ARM).
          - os: windows-latest
            label: Windows (x64 + arm64)
            command: npm run dist:win
          # Linux: x64 and ARM64.
          - os: ubuntu-latest
            label: Linux (x64 + arm64)
            command: npm run dist:linux
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-builder shells out to rpmbuild for .rpm and needs binfmt
      # registered to package an arm64 payload on an x64 runner.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
          docker run --rm --privileged tonistiigi/binfmt --install arm64 || true

      - run: npm ci

      # The installers carry package.json's version in their names and in the
      # app's About box, so it must match the release being cut.
      - name: Stamp the version
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then VERSION="${REF_NAME#v}"; else VERSION="$INPUT_VERSION"; fi
          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "Not a version: $VERSION" >&2
              exit 1
            fi
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          node -p "'Building ' + require('./package.json').version"

      # Defining CSC_LINK as an empty string is NOT the same as leaving it
      # unset. A missing secret still creates the variable, electron-builder
      # takes it as "a certificate was supplied", tries to import "", resolves
      # that to the project directory and dies with "<project dir> not a file".
      # So only export the signing variables when the secrets really exist.
      - name: Configure code signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # The certificate is Apple's Developer ID, so it's for the macOS build only.
          if [ -n "$CSC_LINK" ] && [ "$RUNNER_OS" = "macOS" ]; then
            echo "Signing certificate present - the macOS build will be signed."
            {
              echo "CSC_LINK=$CSC_LINK"
              echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No signing certificate - producing unsigned builds."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID" ] && [ "$RUNNER_OS" = "macOS" ]; then
            echo "Apple credentials present - the macOS build will be notarised."
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          fi
          # Windows: Azure Trusted Signing, the practical route since code-signing
          # certificates moved onto hardware tokens. See docs/CODE-SIGNING.md.
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            echo "Azure Trusted Signing credentials present - the Windows build will be signed."
            {
              echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
              echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
              echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
              echo "AZURE_SIGNING=1"
            } >> "$GITHUB_ENV"
          fi

      - name: Build installers
        shell: bash
        run: |
          args=()
          if [ -n "${AZURE_SIGNING:-}" ]; then
            args+=(
              "-c.win.azureSignOptions.publisherName=$AZURE_PUBLISHER_NAME"
              "-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$AZURE_CERTIFICATE_PROFILE"
            )
          fi
          ${{ matrix.command }} -- "${args[@]}"
        env:
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          # Baked into the bundle so users never have to supply one. A
          # WalletConnect project ID is a public client identifier, not a
          # secret, so a repository variable is the right home for it; the
          # secret is accepted too for anyone who prefers that.
          MAIN_VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID || secrets.WALLETCONNECT_PROJECT_ID }}
          # Where Goldfelty's send fee goes (the owner's Exodus address). Fixed
          # at build time on purpose; see src/main/fees.ts. Unset means no fee.
          MAIN_VITE_GOLDFELTY_FEE_ADDRESS: ${{ vars.GOLDFELTY_FEE_ADDRESS }}
          MAIN_VITE_GOLDFELTY_FEE_ADDRESS_BTC: ${{ vars.GOLDFELTY_FEE_ADDRESS_BTC }}
          MAIN_VITE_GOLDFELTY_FEE_ADDRESS_SOL: ${{ vars.GOLDFELTY_FEE_ADDRESS_SOL }}
          MAIN_VITE_GOLDFELTY_FEE_ADDRESS_TRX: ${{ vars.GOLDFELTY_FEE_ADDRESS_TRX }}

      - uses: actions/upload-artifact@v4
        with:
          name: goldfelty-${{ runner.os }}
          retention-days: 14
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.rpm
            release/*/*.tar.gz

  publish:
    name: Attach to release
    needs: build
    permissions:
      contents: write
      # For the build provenance attestation below.
      id-token: write
      attestations: write
    # A tag push always cuts a release. A manual run only does so when it was
    # given a version — otherwise the installers are just workflow artifacts.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what will be attached
        run: find artifacts -type f -printf '%10s  %p\n' | sort -k2

      # Published with the release so a download can be checked:
      #   shasum -a 256 -c SHA256SUMS.txt --ignore-missing
      - name: Checksums
        run: |
          mkdir -p sums
          # Listed under the names GitHub serves them as: it turns spaces in
          # uploaded file names into dots, and shasum -c matches by name.
          (cd artifacts && find . -type f -print0 | while IFS= read -r -d '' f; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f" | tr ' ' '.')"
          done | sort -k2) > sums/SHA256SUMS.txt
          cat sums/SHA256SUMS.txt

      # A signed record, in GitHub's public transparency log, that each file was
      # built by this workflow from this commit. Anyone can check a download:
      #   gh attestation verify <file> --repo gceoalexyt-ops/goldfelty-portfolio-manager
      # A file swapped anywhere after the build fails that check. Attestations
      # need a public repository (or GitHub Enterprise), hence not fatal.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            artifacts/**/*
            sums/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          # On a manual run the tag does not exist yet; creating it here is the
          # point, since it pins the release to the commit that was built.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          name: Goldfelty Portfolio Manager ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/**/*
            sums/SHA256SUMS.txt
          draft: ${{ inputs.draft == true }}
          fail_on_unmatched_files: true
          # The notes in the repository are the release text. GitHub's
          # generated list of PRs replaced them when both were set.
          body_path: .github/RELEASE_NOTES.md
