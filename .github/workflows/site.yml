name: Deploy goldfelty.com

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  # Lets the site be redeployed without touching it, e.g. after a release so
  # the download buttons pick up new assets.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement turns Pages on via the API using the workflow's own token,
      # so nobody has to visit Settings first. It is a no-op once enabled.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
